---
- name: Verify
  hosts: all
  vars:
    cnspec_bin: /usr/bin/cnspec
    cnspec_test_directory: "/tmp/molecule/cnspec"
  tasks:
    # we do not need to install cnspec because the installation happened already with converge
    - name: Create Molecule directory for test files
      ansible.builtin.file:
        path: "{{ cnspec_test_directory }}"
        state: directory
        mode: '0644'
    - name: Copy cnspec policies to remote
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ cnspec_test_directory }}/{{ item | basename }}"
        mode: '0644'
      with_fileglob:
        - "{{ playbook_dir }}/tests/*mql.yaml"
    - name: Register test files
      ansible.builtin.shell: "ls {{ cnspec_test_directory }}/*.mql.yaml"
      register: test_files
    - name: Execute cnspec policy
      ansible.builtin.command: "{{ cnspec_bin }} scan local -f {{ item }}"
      register: test_results
      loop: "{{ test_files.stdout_lines }}"
      ignore_errors: true
    - name: Display details about the cnspec results
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ test_results.results }}"
    - name: Fail when tests fail
      ansible.builtin.fail:
        msg: "cnspec failed to validate"
      when: item.rc != 0
      loop: "{{ test_results.results }}"

    # providers_url / updates_url config handling: converge ran with default
    # URLs, so mondoo.yml must not carry either key. Then re-apply the config
    # tasks with a custom URL and assert both keys are written (updates_url
    # derived for cnspec v14+), and finally revert to defaults and assert the
    # lines are cleaned up again.
    - name: Read mondoo.yml after default converge
      ansible.builtin.slurp:
        src: /etc/opt/mondoo/mondoo.yml
      register: mondoo_config_default

    - name: Assert no URL keys are written with default URLs
      ansible.builtin.assert:
        that:
          - "'providers_url:' not in (mondoo_config_default.content | b64decode)"
          - "'updates_url:' not in (mondoo_config_default.content | b64decode)"

    # The block mutates mondoo.yml; the always-restore puts the pre-test
    # content back even when an assertion fails, so re-running verify against
    # the same instance starts from the converged state.
    - name: Test custom URL handling and revert cleanup
      block:
        - name: Apply provider config tasks with a custom providers URL
          ansible.builtin.include_role:
            name: ansible-mondoo
            tasks_from: linux_providers
          vars:
            use_become: false
            mondoo_providers_url: "https://mirror.example.com/providers"

        - name: Read mondoo.yml after custom URL run
          ansible.builtin.slurp:
            src: /etc/opt/mondoo/mondoo.yml
          register: mondoo_config_custom

        - name: Assert providers_url and derived updates_url are written
          ansible.builtin.assert:
            that:
              - >-
                mondoo_config_custom.content | b64decode
                is search('(?m)^providers_url: https://mirror\.example\.com/providers$')
              - >-
                mondoo_config_custom.content | b64decode
                is search('(?m)^updates_url: https://mirror\.example\.com$')

        - name: Apply provider config tasks with default URLs again (revert)
          ansible.builtin.include_role:
            name: ansible-mondoo
            tasks_from: linux_providers
          vars:
            use_become: false

        - name: Read mondoo.yml after revert to defaults
          ansible.builtin.slurp:
            src: /etc/opt/mondoo/mondoo.yml
          register: mondoo_config_reverted

        - name: Assert URL keys are removed after revert to defaults
          ansible.builtin.assert:
            that:
              - "'providers_url:' not in (mondoo_config_reverted.content | b64decode)"
              - "'updates_url:' not in (mondoo_config_reverted.content | b64decode)"
      always:
        - name: Restore mondoo.yml to its pre-test content
          ansible.builtin.copy:
            content: "{{ mondoo_config_default.content | b64decode }}"
            dest: /etc/opt/mondoo/mondoo.yml
            mode: '0600'
